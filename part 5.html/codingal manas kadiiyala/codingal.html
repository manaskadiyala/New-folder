<!DOCTYPE html>

<html lang="en">

<head>


    <title>My Projects</title>

    <style>
        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 0;

            background: #f4f4f4;

        }

        header {

            background: #333;

            color: #fff;

            padding: 20px;

            text-align: center;

        }

        .projects-container {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));

            gap: 20px;

            padding: 20px;

            max-width: 1200px;

            margin: auto;

        }

        .project-card {

            background: #fff;

            border-radius: 8px;

            overflow: hidden;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);

            text-align: center;

            transition: transform 0.2s;

        }

        .project-card:hover {

            transform: scale(1.2);

        }

        .project-card img {

            width: 100%;

            height: 180px;

            object-fit: cover;

        }

        .project-card h3 {

            margin: 10px 0;

            font-size: 1.2rem;

        }

        .project-card a {

            display: inline-block;

            margin: 10px;

            padding: 8px 15px;

            background: #007bff;

            color: #fff;

            text-decoration: none;

            border-radius: 4px;

        }

        .project-card a:hover {

            background: #0056b3;

        }
    </style>

</head>
<header>
    <h1>my projects</h1>
    <p>click a project to view details or live demo.</p>
</header>

<div class="projects-container">
    <div class="project-card">
        <img src="" alt="project 1">
        <h3>paint</h3>
        <a href="https://scratch.mit.edu/projects/1206855422" target="_blank">view project </a>
    </div>
    <div class="project-card">
        <img src="" alt="project 2">
        <h3>snake game</h3>
        <a href="https://scratch.mit.edu/projects/1185758805" target="_blank">view project </a>
    </div>
    <div class="project-card">
        <img src="" alt="project 3">
        <h3>car game</h3>
        <a href="https://scratch.mit.edu/projects/1177563788" target="_blank">view project </a>
    </div>
</div>
